<!DOCTYPE html>

<html lang="en">
  <head>
    <title>
      Guess the Mili Song
    </title>

    <link rel="icon" type="image/png" href="icon.png">

    <style>
      body {
        background-color: lightblue;
      }

      h1 {
        color: white;
        text-align: center;
      }

      p {
        color: white;
        text-align: center;
      }

      .topRow {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: center;
        gap: 20px;
        margin: 20px auto;
      }

      .interactiveBox {
        border: 2px solid #000000;
        border-radius: 8px;
        max-width: 50px;
        margin: 20px auto;
        font-family: sans-serif;
      }

      .boxHeader {
        background-color: #229ba8;
        color: white;
        padding: 15px;
        width: 50px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        text-align: center;
        font-size: 14px;
      }

      .boxContent {
        display: none; 
        padding: 15px;
        background-color: #f9f9f9;
        border-top: 1px solid #ddd;
      }

      .audioContainer {
        display: flex;
        justify-content: center;
        margin-top: 20px;
      }

      .textContainer {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 20px;
        width: 100%;
      }

      .input {
        padding: 10px;
        width: 300px;
        border-radius: 10px;
        border: 1px solid #ccc;
      }

      .songContainer {
        background-color: #f0f0f0;
        color: #000000;
        list-style-type: none;
        padding: 0;

        width: 300px;
        height: 150px;

        border: 1px solid #000000;
        transition: all 0.3s ease;
        display: none;
        overflow: hidden; 
      }

      .songContainer.active {
        display: block;
        overflow-y: scroll;
        transition: all 0.3s ease;
      }

      .song {
        padding: 5px;
        border-bottom: 1px solid #ccc;
      }

      .song:hover {
        background-color: #e0e0e0;
      }

      .song.focused {
        background-color: #e0e0e0;
      }

      .playButton {
        width: 50px;
        height: 50px;
        border: 2px solid #2a5953;
        border-radius: 50%;
        background-color: #229ba8;
        color: white;
        cursor: pointer;
      }

      .playButton:hover {
        background-color: #2c7f9a;
      }

      .resultContainer {
        width: 300px;
        height: 125px;

        position: fixed;

        top: 30%;
        left: 50%;
        transform: translate(-50%, -50%); 

        border-radius: 10px;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;

        margin-top: 20px;
        background-color: #229ba8;
        opacity: 0.9;

        display: none;
        transition: all 3s ease;
      }

      .resultContainer.active {
        display: flex;
        transition: all 3s ease;
      }

      .shareButton {
        width: 100px;
        height: 50px;
        border: 2px solid #2a5953;
        border-radius: 10px;
        background-color: #3391b0;
        color: white;
        cursor: pointer;
      }

      .guessTracker{
        width: 260px;
        height: 50px;
        display: flex;
        border:#000000 2px solid;
        border-radius: 10px;
        background-color: #728a8d;
        justify-content: center;
        margin: 20px auto;
      }

      .guessBox {
        width: 35px;
        height: 35px;
        border: 2px solid #000000;
        border-radius: 10px;
        margin: 5px 8px 5px 5px;
        background-color: #f0f0f0;
      }

      .progressBar {
        width: 300px;
        margin: 20px auto;
        display: block;
        cursor: pointer;
      }

      .volumeContainer {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }

      .volumeBar {
        width: 100px;
        cursor: pointer;
      }

      .resultsButton {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 20px auto;

        width: 150px;
        height: 50px;
        border: 2px solid #2a5953;
        border-radius: 5px;
        background-color: #3391b0;
        color: white;
        cursor: pointer;
        display: none;
      }

      .resultsButton.active {
        display: flex;
        transition: all 3s ease;
      }

      .resultsButton:hover {
        background-color: #2c7f9a;
      }

      

    </style>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

  </head>
  <body>
    <div class="topRow">
      <!--
      <div class="interactiveBox">
        <button class="boxHeader" onclick="toggleBox()">Info</button>
        <div class="boxContent" id="myBox">
          <p>How to Play: </p>
        </div>
      </div>
      -->

      <div>
        <h1>Guess the Mili Song</h1>
        <p class="dayCounter"></p>
        
      </div>
    </div>

    <!-- audio start/pause button -->
    <div class="audioContainer">
      <audio class="audioPlayer">
        <source class="audioFile" src="Music/Not My Paradiso.mp3" type="audio/mp3">
        it bork somehow
      </audio>

      <button class="playButton">&#9654;</button>
    </div>

    <!-- volume bar -->
    <div class = volumeContainer>
      <p class="volumeIcon">🔊</p>
      <input 
        type="range" 
        class="volumeBar"
        min="0"
        max="1"
        value="0.5"
        step="0.01"
      >
    </div>

    <!-- Prog bar -->
    <input 
        type="range" 
        class="progressBar"
        min="0"
        max="5"
        value="0"
        step="0.01"
    >


    <!-- Contains the guesses -->
    <div class="guessTracker"></div>

    <!-- User guess box -->
    <div class="textContainer">
      <div>
        <input type="text" class="input" placeholder="Enter your guess here">
      </div>

      <ul class="songContainer"></ul>

    </div>

    <!-- Result -->
    <div class="resultContainer">
      <!--<p class="reslts">You got it correct in # guesses!</p>-->

      <p class="shareMessage"></p>

      <button class="shareButton">Share</button>
    </div>


    <!-- See results again -->
     <div>
      <button class="resultsButton" onclick="toggleResults()">See Results Again</button>
     </div>

     <script src="main.js"></script>
  </body>
</html>
